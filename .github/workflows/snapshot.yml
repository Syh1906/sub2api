name: 按需发布临时快照镜像

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 已通过默认分支 CI 的完整源码 SHA
        required: true
        type: string
      base_version:
        description: 本 fork 已发布的标签，例如 v0.2.22-fork.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  snapshot:
    if: github.repository == 'Syh1906/sub2api' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      COMMIT: ${{ inputs.commit }}
      BASE: ${{ inputs.base_version }}
      BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 核对源码、基线和同一提交的 CI
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ && "$BASE" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-fork\.[1-9][0-9]*$ ]]
          gh release view "$BASE" --json isDraft,isPrerelease --jq '.isDraft == false and .isPrerelease == false' | grep -qx true
          base_sha=$(git rev-parse --verify "refs/tags/$BASE^{commit}")
          git merge-base --is-ancestor "$base_sha" "$COMMIT"
          git merge-base --is-ancestor "$COMMIT" "refs/remotes/origin/$BRANCH"
          git diff --exit-code --quiet "$base_sha" "$COMMIT" -- backend/migrations backend/ent/schema
          gh run list --workflow backend-ci.yml --branch "$BRANCH" --commit "$COMMIT" --limit 1 \
            --json headSha,status,conclusion | jq -e --arg sha "$COMMIT" 'length == 1 and .[0].headSha == $sha and .[0].status == "completed" and .[0].conclusion == "success"'
          tag="snapshot-${COMMIT:0:12}-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "version=${BASE#v}+$tag" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
          git checkout --detach "$COMMIT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 发布独立快照标签
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.plan.outputs.image }}:${{ steps.plan.outputs.tag }}
          build-args: |
            VERSION=${{ steps.plan.outputs.version }}
            COMMIT=${{ inputs.commit }}
            DATE=${{ steps.plan.outputs.date }}
            GOPROXY=https://proxy.golang.org,direct
            GOSUMDB=sum.golang.org
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ inputs.commit }}
            org.opencontainers.image.version=${{ steps.plan.outputs.version }}
          cache-from: type=gha,scope=fork-snapshot-amd64
          cache-to: type=gha,mode=max,scope=fork-snapshot-amd64
      - name: 拉取快照并记录不可变摘要
        env:
          IMAGE: ${{ steps.plan.outputs.image }}
          DIGEST: ${{ steps.image.outputs.digest }}
          BASE_SHA: ${{ steps.plan.outputs.base_sha }}
          TAG: ${{ steps.plan.outputs.tag }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          ref="$IMAGE@$DIGEST"
          docker pull "$ref"
          test "$(docker image inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$ref")" = "$COMMIT"
          docker run --rm --network none --entrypoint /app/sub2api "$ref" -version 2>&1 | grep -F "Sub2API $VERSION (commit: $COMMIT,"
          jq -n --arg image "$ref" --arg tag "$TAG" --arg version "$VERSION" --arg commit "$COMMIT" \
            --arg base "$BASE" --arg baseCommit "$BASE_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            '{kind:"snapshot",image:$image,tag:$tag,version:$version,commit:$commit,baseVersion:$base,baseCommit:$baseCommit,platforms:["linux/amd64"],runURL:$run}' > snapshot.json
          echo "快照：$ref" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: snapshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: snapshot.json
          if-no-files-found: error
